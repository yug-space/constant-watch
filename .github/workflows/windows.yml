name: Windows package
on:
  workflow_dispatch:
  push:
    branches: [main]
env:
  PYTHONUTF8: "1"
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: windows/requirements.txt
      - name: Install dependencies
        run: python -m pip install -e ".[dev]" -r windows/requirements.txt
      - name: Unit tests
        run: python -m pytest -q
      - name: Parse and exercise Windows capture helper
        shell: powershell
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path src/constant_watch/windows_capture.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          powershell.exe -NoProfile -File src/constant_watch/windows_capture.ps1 -Command status
          if ($LASTEXITCODE) { throw 'Capture helper failed' }
      - name: Capture a synthetic Windows fixture
        run: python windows/capture-smoke.py
      - name: Freeze desktop and MCP service
        run: python -m PyInstaller --noconfirm windows/constant-watch.spec
      - name: Third-party notices
        run: python scripts/third-party-notices.py "dist/Constant Watch/THIRD-PARTY-NOTICES.txt"
      - name: Packaged service and MCP smoke test
        run: python windows/smoke.py
      - name: Open the packaged desktop window
        run: python windows/desktop-smoke.py
      - name: Compile per-user installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows/installer.iss
          if ($LASTEXITCODE) { throw 'Installer build failed' }
          $setup = Get-Item dist/*Setup.exe
          if ($setup.Length -gt 25MB) { throw 'Installer exceeds public hosting file limit' }
          Get-FileHash dist/*Setup.exe -Algorithm SHA256 | Format-List
      - name: Install and verify the distributed app
        shell: pwsh
        run: |
          $folder = Join-Path $env:RUNNER_TEMP 'Constant Watch Installed'
          $installer = Get-Item dist/*Setup.exe
          $install = Start-Process $installer.FullName -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="' + $folder + '"')) -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Installation failed' }
          python windows/smoke.py "$folder/constant-watch-service.exe"
          if ($LASTEXITCODE) { throw 'Installed package verification failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: Constant-Watch-Windows-x64
          path: dist/*Setup.exe
          retention-days: 14
